<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación de Menús | Eventos Premium</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="app-container">

        <!-- View 1: Gallery (Full Width) -->
        <section id="view-gallery" class="view active fade-in">
            <header class="hero-header">
                <div class="hero-content">
                    <h1 class="hero-title">Experiencias Gastronómicas</h1>
                    <p class="hero-subtitle">Seleccione la propuesta perfecta para su evento. Calidad, elegancia y
                        sabor.</p>
                </div>
            </header>

            <div class="menu-gallery-grid" id="menuGrid">
                <!-- Injected by JS -->
            </div>
        </section>

        <!-- View 2: Configurator (Split Screen) -->
        <section id="view-config" class="view fade-in">
            <div class="config-top-bar">
                <button class="btn-back" onclick="showGallery()">← Volver a Menús</button>
            </div>

            <div class="config-layout">
                <!-- Left: Work Area (Menu Details + Config Options) -->
                <div class="work-area-col">
                    <div class="menu-details-section" id="selectedMenuCard">
                        <!-- Injected by JS -->
                    </div>

                    <h3 class="section-title">Personalización</h3>
                    <div id="menuOptionsContainer" class="menu-options-area">
                        <!-- Injected by JS -->
                    </div>
                </div>

                <!-- Right: Summary & Checkout Panel -->
                <aside class="config-panel">
                    <h2 class="config-title">Resumen & Datos</h2>
                    <div class="form-group">
                        <label class="form-label">Seleccione Hotel</label>
                        <div class="hotel-selector" id="hotelSelector">
                            <!-- Hotels injected by JS -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre Cliente / Evento</label>
                        <input type="text" class="form-input" id="clientName" placeholder="Ej. Boda 2024">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-input" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Comensales</label>
                        <input type="number" class="form-input" id="guestInput" value="100" min="1">
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-box">
                        <label class="form-label">Total Estimado</label>
                        <div class="total-price" id="totalPrice">0.00€</div>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-secondary" onclick="showBudgetPreview()">
                            Visualizar
                        </button>
                        <button class="btn-primary" onclick="generatePDF()">
                            PDF
                        </button>
                    </div>
                </aside>
            </div>

        </section>

        <!-- Budget Preview Modal -->
        <div id="budgetModal" class="modal-overlay">
            <div class="modal-content paper-preview">
                <button class="close-modal" onclick="closeBudgetPreview()">×</button>
                <div id="previewContent">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script src="js/logos.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
