<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación de Menús | Eventos Premium</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="img/MENÚS • EVENTOS.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="app-container">

        <!-- View 1: Gallery (Full Width) -->
        <section id="view-gallery" class="view active fade-in">
            <header class="hero-header">
                <div class="hero-content">
                    <h1 class="hero-title">Experiencias Gastronómicas</h1>
                    <p class="hero-subtitle">Seleccione la propuesta perfecta para su evento. Calidad, elegancia y sabor.</p>
                    <div style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px;">

                        <!-- Event Title Input -->
                        <div style="width: 100%; max-width: 500px; text-align:center;">
                            <label style="display:block; font-size:0.65rem; letter-spacing:0.3em; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:8px;">Título del evento</label>
                            <input id="eventTitle" type="text" value="EVENTOS"
                                style="width:100%; padding:12px 20px; background:rgba(255,255,255,0.08); border:1px solid rgba(245,158,11,0.5); color:white; font-size:1.6rem; font-family:'Outfit',sans-serif; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; text-align:center; border-radius:8px; outline:none; backdrop-filter:blur(5px);"
                                placeholder="EVENTOS" maxlength="22">
                            <p style="font-size:0.6rem; color:rgba(255,255,255,0.3); margin-top:6px;">Máx. 22 caracteres para que quede bien</p>
                        </div>

                        <button onclick="generatePresentation()" class="btn-primary" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none; font-size: 0.9rem; background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; backdrop-filter: blur(5px); cursor: pointer;">
                             🖨️ Generar Carta de Presentación
                        </button>
                        
                        <div style="width: 100%; max-width: 400px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);">
                            <p style="font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Sede del Evento:</p>
                            <div id="hotelSelector" class="hotel-selector">
                                <!-- Injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="menu-gallery-grid" id="menuGrid">
                <!-- Injected by JS -->
            </div>
        </section>

        <!-- View 2: Configurator (Split Screen) -->
        <section id="view-config" class="view fade-in">
            <div class="config-top-bar">
                <button class="btn-back" onclick="showGallery()">← Volver a Menús</button>
            </div>

            <div class="config-layout">
                <!-- Left: Work Area (Menu Details + Config Options) -->
                <div class="work-area-col">
                    <div class="menu-details-section" id="selectedMenuCard">
                        <!-- Injected by JS -->
                    </div>

                    <h3 class="section-title">Personalización</h3>
                    <div id="menuOptionsContainer" class="menu-options-area">
                        <!-- Injected by JS -->
                    </div>
                </div>

                <!-- Right: Summary & Checkout Panel -->
                <aside class="config-panel">
                    <h2 class="config-title">Resumen & Datos</h2>
                    <div class="form-group">
                        <label class="form-label">Seleccione Hotel</label>
                        <div class="hotel-selector" id="hotelSelectorSidebar">
                            <!-- Hotels injected by JS -->
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre Cliente / Evento</label>
                        <input type="text" class="form-input" id="clientName" placeholder="Ej. Boda 2024">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-input" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Comensales</label>
                        <input type="number" class="form-input" id="guestInput" value="100" min="1">
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-box">
                        <label class="form-label">Total Estimado</label>
                        <div class="total-price" id="totalPrice">0.00€</div>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-secondary" onclick="showBudgetPreview()">
                            Visualizar
                        </button>
                        <button class="btn-primary" onclick="generatePDF()">
                            PDF
                        </button>
                    </div>
                </aside>
            </div>

        </section>

        <!-- Budget Preview Modal -->
        <div id="budgetModal" class="modal-overlay">
            <div class="modal-content paper-preview">
                <button class="close-modal" onclick="closeBudgetPreview()">×</button>
                <div id="previewContent">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
